<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Ruta - Ruteros Ñuble</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />

    <style>
        :root {
            --bg-color: #121212;
            --bg-darker: #0a0a0a;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --red-accent: #e60000;
            --red-hover: #b30000;
            --input-bg: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.5rem 5%; background-color: var(--bg-darker);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); height: 70px;
        }

        .logo-text {
            font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; text-decoration: none;
            color: var(--text-main); transition: color 0.3s;
        }

        .logo-text:hover { color: var(--red-accent); }
        .header-logo { height: 50px; width: 50px; border-radius: 50%; object-fit: cover; }

        .main-container { display: flex; flex: 1; height: calc(100vh - 70px); }

        .form-panel {
            flex: 0 0 35%; padding: 1.5rem 3%; background: var(--bg-color);
            overflow-y: auto; border-right: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-panel h1 {
            font-family: 'Oswald', sans-serif; font-size: 1.8rem;
            margin-bottom: 1rem; color: var(--text-main); text-transform: uppercase;
        }

        .form-group { margin-bottom: 0.8rem; display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 0.3rem; font-weight: 600; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
        
        .form-control {
            background-color: var(--input-bg); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 8px 12px; font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem; border-radius: 5px; outline: none; transition: border-color 0.3s;
            width: 100%;
        }
        .form-control:focus { border-color: var(--red-accent); }
        textarea.form-control { resize: vertical; min-height: 60px; }

        /* ESTILOS PARA PARADAS DINÁMICAS */
        .parada-row {
            display: flex;
            gap: 6px;
            margin-bottom: 0.5rem;
            align-items: center;
        }

        .btn-remove-parada {
            background: #333;
            color: var(--red-accent);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-remove-parada:hover {
            background: var(--red-accent);
            color: white;
        }

        .btn-add-parada {
            background: transparent;
            color: var(--text-main);
            border: 1px dashed rgba(255,255,255,0.3);
            padding: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 0.8rem;
            transition: all 0.3s;
        }
        .btn-add-parada:hover {
            border-color: var(--red-accent);
            color: var(--red-accent);
        }

        .btn-submit {
            background-color: var(--red-accent); color: white; border: none; padding: 12px;
            font-family: 'Oswald', sans-serif; font-size: 1.1rem; text-transform: uppercase;
            letter-spacing: 1px; border-radius: 5px; cursor: pointer; width: 100%;
            transition: all 0.3s ease; margin-top: 0.5rem;
        }
        .btn-submit:hover { background-color: var(--red-hover); }

        .map-panel { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; z-index: 1; }

        .leaflet-tile {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        .leaflet-routing-container { display: none !important; }

        @media (max-width: 900px) {
            body { overflow-y: auto; height: auto; }
            .main-container { flex-direction: column; height: auto; }
            .form-panel { flex: none; width: 100%; border-right: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
            .map-panel { flex: none; width: 100%; height: 50vh; min-height: 400px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo-text">← Volver al Inicio</a>
        <img src="./img/ruteros.jpeg" alt="Logo Ruteros Ñuble" class="header-logo">
    </header>

    <div class="main-container">
        <div class="form-panel">
            <h1>Planificar Ruta</h1>
            
            <div class="form-group">
                <label for="nombre_piloto">Tu Nombre</label>
                <input type="text" id="nombre_piloto" class="form-control" placeholder="Ej: Juan Pérez">
            </div>

            <div class="form-group">
                <label for="nombre_ruta">Nombre de la Ruta</label>
                <input type="text" id="nombre_ruta" class="form-control" placeholder="Ej: Rutón precordillera">
            </div>

            <div class="form-group">
                <label for="inicio">Punto de Salida</label>
                <input type="text" id="inicio" class="form-control" placeholder="Ej: Chillán, Chile" onchange="calcularRuta()">
            </div>

            <div class="form-group">
                <label>Paradas Intermedias (Opcional)</label>
                <div id="paradas-container"></div>
                <button type="button" class="btn-add-parada" onclick="agregarCampoParada()">+ Agregar Parada</button>
            </div>

            <div class="form-group">
                <label for="destino">Destino Final</label>
                <input type="text" id="destino" class="form-control" placeholder="Ej: Las Trancas, Chile" onchange="calcularRuta()">
            </div>

            <div class="form-group">
                <label for="fecha">Fecha de la Ruta</label>
                <input type="date" id="fecha" class="form-control">
            </div>

            <div class="form-group">
                <label for="comentarios">Comentarios</label>
                <textarea id="comentarios" class="form-control" placeholder="Puntos de encuentro, bencineras, horario, etc."></textarea>
            </div>

            <button class="btn-submit" onclick="guardarRuta()" id="btnCrear">Crear Ruta</button>
            <p id="mensajeError" style="color: var(--red-accent); font-size: 0.8rem; margin-top: 10px; display: none;"></p>
        </div>

        <div class="map-panel">
            <div id="map"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>

    <script>
        let map;
        let routingControl = null;
        let contadorParadas = 0;

        document.addEventListener('DOMContentLoaded', () => {
            map = L.map('map').setView([-36.6066, -72.1034], 9);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors'
            }).addTo(map);

            // No permitir seleccionar fechas pasadas
            const inputFecha = document.getElementById('fecha');
            const hoy = new Date().toISOString().split('T')[0];
            inputFecha.min = hoy;
        });

        // Agrega una nueva parada al formulario
        function agregarCampoParada() {
            contadorParadas++;
            const container = document.getElementById("paradas-container");

            const div = document.createElement("div");
            div.className = "parada-row";
            div.id = `parada-row-${contadorParadas}`;
            div.innerHTML = `
                <input type="text" class="form-control input-parada" placeholder="Parada ${contadorParadas} (Ej: San Carlos)" onchange="calcularRuta()">
                <button type="button" class="btn-remove-parada" onclick="quitarCampoParada(${contadorParadas})">✕</button>
            `;
            container.appendChild(div);
        }

        // Quita una parada y recalcula
        function quitarCampoParada(id) {
            const row = document.getElementById(`parada-row-${id}`);
            if (row) {
                row.remove();
                calcularRuta();
            }
        }

        async function obtenerCoordenadas(direccion) {
            if (!direccion || direccion.trim() === "") return null;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(direccion)}`);
                const data = await response.json();
                if (data && data.length > 0) {
                    return L.latLng(data[0].lat, data[0].lon);
                }
                return null;
            } catch (error) {
                console.error("Error buscando coordenadas:", error);
                return null;
            }
        }

        async function calcularRuta() {
            const inicioText = document.getElementById("inicio").value.trim();
            const destinoText = document.getElementById("destino").value.trim();
            const msjError = document.getElementById("mensajeError");
            const btn = document.getElementById("btnCrear");

            // Recolectar las paradas intermedias
            const inputsParadas = document.querySelectorAll(".input-parada");
            const paradasText = Array.from(inputsParadas).map(i => i.value.trim()).filter(v => v !== "");

            // Solo calcular si hay al menos inicio y destino
            if (inicioText !== "" && destinoText !== "") {
                btn.textContent = "Calculando...";
                msjError.style.display = 'none';

                // Recolectar todas las ubicaciones en orden: [Inicio, Parada 1, Parada 2, ..., Destino]
                const listaDirecciones = [inicioText, ...paradasText, destinoText];

                // Buscar coordenadas en paralelo
                const promesas = listaDirecciones.map(dir => obtenerCoordenadas(dir));
                const waypoints = await Promise.all(promesas);

                // Comprobar si alguna dirección falló
                if (waypoints.some(coord => coord === null)) {
                    msjError.textContent = "No se pudo encontrar una de las ubicaciones ingresadas. Intenta ser más específico.";
                    msjError.style.display = 'block';
                    btn.textContent = "Crear Ruta";
                    return;
                }

                // Borrar trazado anterior
                if (routingControl) {
                    map.removeControl(routingControl);
                }

                // Dibujar ruta completa pasando la lista con todas las paradas
                routingControl = L.Routing.control({
                    waypoints: waypoints,
                    lineOptions: {
                        styles: [{ color: '#e60000', weight: 4 }]
                    },
                    createMarker: function(i, wp, nWps) {
                        return L.marker(wp.latLng);
                    },
                    fitSelectedRoutes: true,
                    show: false
                }).addTo(map);

                btn.textContent = "Crear Ruta";
            }
        }

        async function guardarRuta() {
            const msjError = document.getElementById("mensajeError");
            const btn = document.getElementById("btnCrear");

            const nombre_piloto = document.getElementById("nombre_piloto").value.trim();
            const nombre_ruta = document.getElementById("nombre_ruta").value.trim();
            const inicio = document.getElementById("inicio").value.trim();
            const destino = document.getElementById("destino").value.trim();
            const fecha = document.getElementById("fecha").value;
            const comentarios = document.getElementById("comentarios").value.trim();

            const inputsParadas = document.querySelectorAll(".input-parada");
            const paradas = Array.from(inputsParadas).map(i => i.value.trim()).filter(v => v !== "");

            if (!nombre_piloto || !nombre_ruta || !inicio || !destino || !fecha) {
                msjError.textContent = "Por favor completa tu nombre, nombre de la ruta, inicio, destino y fecha.";
                msjError.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.textContent = "Guardando...";
            msjError.style.display = 'none';

            try {
                const response = await fetch('/api/rutas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre_piloto, nombre_ruta, inicio, paradas, destino, comentarios, fecha })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'No se pudo guardar la ruta.');
                }

                alert("¡Ruta creada con éxito!");
                window.location.href = "unirse.html";
            } catch (error) {
                msjError.textContent = error.message;
                msjError.style.display = 'block';
                btn.disabled = false;
                btn.textContent = "Crear Ruta";
            }
        }
    </script>
</body>
</html>
